<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Vista móvil · PAM Baruta</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Figtree,system-ui,sans-serif;background:#ecedea;color:#082e1b;min-height:100vh}
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding:22px 28px}
h1{font-size:1.5em;font-weight:900}
h1 span{color:#0e683b}
.sub{font-size:.92em;color:#2e4436;font-weight:500;margin-top:2px}
.ctrl{display:flex;flex-wrap:wrap;gap:8px}
.ctrl button{border:2px solid #fff;background:rgba(255,255,255,.55);border-radius:999px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer;color:#082e1b}
.ctrl button[aria-pressed="true"]{background:#082e1b;border-color:#082e1b;color:#fff}
.sizes{display:flex;gap:6px;align-items:center;font-weight:700;font-size:.88em}
.sizes select{font:inherit;padding:8px 12px;border-radius:12px;border:2px solid #fff;background:#fff}
.stage{display:flex;gap:34px;padding:10px 28px 50px;overflow-x:auto;align-items:flex-start}
.stage.single{justify-content:center}
.dev{flex:none;display:flex;flex-direction:column;align-items:center;gap:12px}
.dev .lbl{font-weight:800;display:flex;gap:10px;align-items:center}
.dev .lbl a{font-size:.8em;color:#0e683b}
.phone{background:#16181a;border-radius:50px;padding:10px;box-shadow:0 30px 70px rgba(8,46,27,.3);position:relative}

.screen{border-radius:42px;overflow:hidden;background:#fff;position:relative}
.screen iframe{border:0;display:block;transform-origin:0 0;background:#fff}
.note{padding:0 28px 30px;font-size:.88em;color:#2e4436;max-width:900px}
</style>
</head>
<body>
<div class="top">
  <div><h1>PAM Baruta · <span>vista móvil</span></h1><p class="sub">Cada teléfono es la página real: puedes desplazarte, tocar botones y llenar formularios.</p></div>
  <div class="ctrl" id="ctrl" role="group" aria-label="Pantallas">
    <button data-p="all" aria-pressed="true">Todas</button>
    <button data-p="index">Inicio</button><button data-p="cobertura">Zonas</button><button data-p="registro">Registro</button><button data-p="eventos">Eventos</button><button data-p="tips">Tips</button><button data-p="admin">Admin</button>
  </div>
  <label class="sizes">Teléfono
    <select id="size"><option value="390x844">iPhone 14 · 390×844</option><option value="360x780">Android · 360×780</option><option value="375x667">iPhone SE · 375×667</option><option value="430x932">iPhone Pro Max · 430×932</option></select>
  </label>
</div>
<div class="stage" id="stage"></div>
<p class="note">Consejo: en un teléfono real, abre el sitio directamente para probarlo con el dedo. Esta página es solo para revisar y ajustar el diseño desde la computadora.</p>
<script>
const PAGES = [['index','Inicio'],['cobertura','Zonas'],['registro','Registro'],['eventos','Eventos'],['tips','Tips de salud'],['preguntas','Preguntas'],['admin/index','Admin']];
let sel = 'all';
function render(){
  const [w, h] = document.getElementById('size').value.split('x').map(Number);
  const list = sel === 'all' ? PAGES.slice(0, 5) : PAGES.filter(p => p[0] === sel);
  const scale = sel === 'all' ? Math.min(1, (window.innerHeight - 190) / h) : Math.min(1.1, (window.innerHeight - 170) / h);
  const st = document.getElementById('stage');
  st.className = 'stage' + (list.length === 1 ? ' single' : '');
  st.innerHTML = list.map(([f, t]) => `<div class="dev"><div class="lbl">${t} <a href="../sitio/${f}.html" target="_blank" rel="noopener">abrir ↗</a></div>
    <div class="phone"><div class="screen" style="width:${w*scale}px;height:${h*scale}px"><iframe src="../sitio/${f}.html" title="${t} en móvil" style="width:${w}px;height:${h}px;transform:scale(${scale})"></iframe></div></div></div>`).join('');
}
document.getElementById('ctrl').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; sel = b.dataset.p;
  document.querySelectorAll('#ctrl button').forEach(x => x.setAttribute('aria-pressed', x === b)); render();
});
document.getElementById('size').onchange = render;
let t; addEventListener('resize', () => { clearTimeout(t); t = setTimeout(render, 200); });
render();
</script>
</body>
</html>
